<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eye Care Reminder Options</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, sans-serif;
        color: #1a1512;
        background:
          radial-gradient(circle at top right, rgba(245, 192, 118, 0.2), transparent 35%),
          linear-gradient(180deg, #fbf4e9 0%, #fffdf8 100%);
      }

      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 40px 20px 56px;
      }

      .card {
        background: rgba(255, 255, 255, 0.88);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 18px 46px rgba(113, 87, 48, 0.11);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin: 20px 0 24px;
      }

      .metric {
        padding: 16px;
        border-radius: 18px;
        background: #fff8ee;
      }

      .runtime-status {
        margin: 8px 0 24px;
        padding: 18px 20px;
        border-radius: 18px;
        background: #fff8ee;
      }

      .section-toggle {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        cursor: pointer;
        list-style: none;
      }

      .section-toggle::-webkit-details-marker {
        display: none;
      }

      .section-toggle-copy {
        display: grid;
        gap: 4px;
      }

      .section-toggle-copy strong {
        font-size: 24px;
        line-height: 1.2;
      }

      .section-toggle-note {
        color: #5f4f3f;
      }

      .toggle-meta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        color: #6f5b47;
        font-size: 13px;
      }

      .toggle-meta::after {
        content: '▾';
        font-size: 14px;
        transition: transform 180ms ease;
      }

      details[open] > .section-toggle .toggle-meta::after {
        transform: rotate(180deg);
      }

      .details-body {
        margin-top: 16px;
      }

      .runtime-diagnostics .section-toggle-copy strong {
        font-size: 22px;
      }

      .runtime-diagnostics .section-toggle-note {
        font-size: 15px;
      }

      .status-glance {
        margin-top: -4px;
        margin-bottom: 24px;
        font-size: 14px;
      }

      .status-list {
        display: grid;
        gap: 10px;
        margin: 0;
      }

      .status-list div {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(76, 59, 34, 0.12);
      }

      .status-list div:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .status-list dt {
        color: #6f5b47;
      }

      .status-list dd {
        margin: 0;
        font-weight: 700;
      }

      .settings {
        margin: 0 0 24px;
        padding: 18px 20px;
        border-radius: 18px;
        background: #fff8ee;
      }

      .settings h2 {
        margin: 0 0 12px;
      }

      details.settings > .details-body .setting:first-child {
        margin-top: 4px;
      }

      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      .setting.checkbox {
        justify-content: flex-start;
      }

      .setting.checkbox input {
        margin: 0;
      }

      .setting-inline {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .setting select {
        min-width: 190px;
        border: 1px solid rgba(76, 59, 34, 0.16);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        background: #fff;
      }

      .setting select:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .setting input[type='number'] {
        width: 140px;
        border: 1px solid rgba(76, 59, 34, 0.16);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        background: #fff;
      }

      .setting input[type='number']:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .setting-note,
      .settings-status {
        margin: 0 0 12px;
        color: #5f4f3f;
      }

      .plan-feature-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .plan-feature-row {
        display: grid;
        grid-template-columns: minmax(0, 160px) minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.72);
      }

      .plan-feature-copy {
        color: #5f4f3f;
        font-size: 13px;
      }

      .plan-feature-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 64px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(209, 73, 91, 0.12);
        color: #b9384a;
        font-size: 12px;
        font-weight: 700;
      }

      .plan-feature-badge[data-enabled='true'] {
        background: rgba(45, 106, 79, 0.14);
        color: #2d6a4f;
      }

      .notice-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .notice-list li {
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.72);
        color: #5f4f3f;
      }

      .enabled-sites {
        margin: 0 0 24px;
        padding: 18px 20px;
        border-radius: 18px;
        background: #fff8ee;
      }

      .enabled-sites h2 {
        margin: 0 0 8px;
      }

      .enabled-sites p {
        margin: 0 0 12px;
        color: #5f4f3f;
      }

      .report {
        margin: 0 0 24px;
        padding: 18px 20px;
        border-radius: 18px;
        background: #fff8ee;
      }

      .section-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      .section-header h2 {
        margin: 0 0 6px;
      }

      .section-header p {
        margin: 0;
        color: #5f4f3f;
      }

      .report-controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .report-controls select {
        min-width: 140px;
        border: 1px solid rgba(76, 59, 34, 0.16);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        background: #fff;
      }

      .report-metrics {
        margin: 0 0 16px;
      }

      .report-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
      }

      .report-card {
        padding: 16px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.72);
      }

      .report-card h3 {
        margin: 0 0 12px;
      }

      .trend-list {
        display: grid;
        gap: 10px;
      }

      .trend-row {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) 72px;
        gap: 10px;
        align-items: center;
      }

      .trend-date,
      .trend-value {
        color: #6f5b47;
        font-size: 13px;
      }

      .trend-bar-track {
        height: 10px;
        border-radius: 999px;
        background: rgba(45, 106, 79, 0.12);
        overflow: hidden;
      }

      .trend-bar-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2d6a4f 0%, #4c956c 100%);
      }

      .domain-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .domain-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .domain-copy {
        display: grid;
        gap: 2px;
      }

      .domain-copy span,
      .domain-share {
        color: #6f5b47;
        font-size: 13px;
      }

      .site-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .site-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.72);
      }

      .site-meta {
        display: grid;
        gap: 4px;
      }

      .site-origin {
        color: #6f5b47;
        font-size: 13px;
        word-break: break-all;
      }

      .empty-state {
        margin: 0;
      }

      .site-remove {
        flex-shrink: 0;
      }

      @media (max-width: 640px) {
        .setting {
          flex-direction: column;
          align-items: stretch;
        }

        .setting-inline {
          flex-direction: column;
          align-items: stretch;
        }

        .section-header {
          flex-direction: column;
        }

        .plan-feature-row {
          grid-template-columns: 1fr;
        }

        .site-row {
          flex-direction: column;
          align-items: stretch;
        }

        .trend-row {
          grid-template-columns: 42px minmax(0, 1fr) 64px;
        }
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font: inherit;
        cursor: pointer;
        background: #2d6a4f;
        color: #fff;
      }

      button.secondary {
        background: #d1495b;
      }

      button.tertiary {
        background: rgba(255, 255, 255, 0.9);
        color: #2d6a4f;
        border: 1px solid rgba(45, 106, 79, 0.22);
      }

      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .trend {
        margin-top: 28px;
      }

      .strategy-list {
        display: grid;
        gap: 12px;
      }

      .strategy-option {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 14px 16px;
        border-radius: 18px;
        background: #fff8ee;
      }

      .strategy-option span {
        display: flex;
        flex-direction: column;
      }

      .strategy-option small {
        color: #6f5b47;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 10px 0;
        border-bottom: 1px solid rgba(76, 59, 34, 0.12);
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
